databases:
  - name: paper-trading-db
    plan: free
services:
  - type: web
    name: paper-trading-engine
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODE
        value: live
      - key: CONTROL_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: paper-trading-db
          property: connectionString
